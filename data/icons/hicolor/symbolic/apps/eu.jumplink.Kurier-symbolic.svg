<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    PLACEHOLDER symbolic variant of the scalable app icon above.

    Two things are convention, not taste: the 16×16 grid with a 2px safe margin,
    and a single monochrome fill. GTK recolours a symbolic icon by restyling it, so
    a second colour here would be thrown away — and `hicolor/symbolic/apps/` is
    where GTK looks for `<app id>-symbolic`, which is why this is its own directory
    and not the same file at another size (gjsify/cli AGENTS.md, "symbolic is an
    icon CONTEXT, never a size").

    Inside the root element on purpose — see the same note in the scalable icon:
    gdk-pixbuf's SVG loader, which `flatpak build-export` validates icons with,
    rejects a comment placed above `<svg>`.

    TODO: replace together with the scalable icon, never one without the other.
  -->
  <g fill="#bebebe">
    <rect x="3" y="4" width="9" height="2" rx="1"/>
    <rect x="3" y="7" width="10" height="2" rx="1"/>
    <rect x="3" y="10" width="6" height="2" rx="1"/>
  </g>
</svg>