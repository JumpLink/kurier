name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Also callable, so a tag's release runs this exact job instead of a second copy of the
  # toolchain kept in step with this one by hand.
  workflow_call:

# The gjsify toolchain, as in postbote/troedler/beifahrer: `gjsify install --immutable`, the bundled
# `gjsify tsc` type-check, `gjsify build` for the app, and the unit tests under BOTH gjs and node.
#
# The GJS half is the point, not a bonus. A pure Node suite would be green and would not answer the
# question this project exists for: does a real ACP handshake survive a full gjsify bundle with no
# Node process in the chain? (See AGENTS.md — the `node:child_process` specifier rule exists
# because that chain was measured twice and failed twice.)
#
# `opencode` is deliberately NOT installed here. The real-agent integration test needs a model
# account, and a test that costs a model call is not a test. It runs locally:
#   gjsify workspace kurier-cli test:real-agent
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      # gjs only: the test bundle spawns a child process over stdio and nothing else. No GTK, no
      # GI typelib — an ACP client has no widgets in Scheibe 1.
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs

      - uses: actions/checkout@v4

      # Node 24: gjsify's native install-backend prebuilds target node 24; Fedora's default node
      # 22 loads a mismatched ABI and segfaults `gjsify install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Bootstrap the SAME gjsify version the app pins — read from app/package.json, never
      # repeated here, so the two cannot drift apart.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      # The vendored ACP schema against the code. A hand-written copy of a protocol schema drifts,
      # and the drift is silent at runtime: a renamed method is a `-32601` against a live agent, and
      # a field that became required is an agent that ignores what kurier sent.
      - name: Check the code against refs/acp/schema.v1.json
        run: node scripts/check-schema.mjs

      # -A includes the `private: true` workspaces — without it the packages are skipped and the
      # check silently covers only part of the tree.
      - name: Type check (every workspace)
        run: gjsify foreach -A check

      - name: Lint
        run: gjsify foreach -A lint

      # oxfmt directly, not `gjsify format`: the gjsify formatter under GJS cannot format every
      # file type and SKIPS those silently — a check that is green locally and red here.
      - name: Format check
        run: node_modules/.bin/oxfmt --check .

      - name: Build the app bundle
        run: gjsify workspace kurier-cli build

      # The dual run. If a change makes the Node leg impossible, the change is in the wrong file.
      - name: Unit tests (gjs + node)
        run: gjsify workspace kurier-cli test

      # The bundle a person would install has to at least start and print its command table.
      - name: Smoke — the built bundle starts and lists its agents
        run: |
          gjsify run app/dist/kurier.gjs.mjs agents
          gjsify run app/dist/kurier.gjs.mjs sessions

      # ── Packaging (ADR 0024 in gjsify: assembly is not host-bound, only running the payload
      # is) — built here, not in release.yml, so there is exactly one definition of the
      # toolchain and "green". `gjsify.ship` packages the GUI (`kurier-app`), the one binary with
      # a desktop entry and an App-ID — the same split buchhaltung uses for its CLI+GUI pair.
      # msitools adds `wixl`, the Linux-side MSI compiler `gjsify ship windows --target msi`
      # needs; appimagetool is downloaded below because no distro packages it.
      - name: Install packaging prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          msitools squashfs-tools

      - name: Build the GUI app bundle (GJS, for Linux)
        run: gjsify workspace kurier-cli build:app

      - name: Build the GUI app bundle (Node, for macOS + Windows)
        run: gjsify workspace kurier-cli build:app:node

      # Pinned by version AND digest, the same shape gjsify's own CI image uses (see
      # easy6502's and buchhaltung's release workflows). The RUNTIME pin is the load-bearing
      # half: appimagetool otherwise fetches it per-arch from type2-runtime's rolling
      # `continuous` tag on every pack, so without this two packs of one build would not be
      # byte-identical.
      - name: Install appimagetool and pin its runtime
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGE_RUNTIME_VERSION: "20251108"
          APPIMAGE_RUNTIME_X86_64_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool
          mkdir -p /usr/local/share/gjsify/appimage-runtime
          curl -fsSL -o /usr/local/share/gjsify/appimage-runtime/runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_X86_64_SHA256}  /usr/local/share/gjsify/appimage-runtime/runtime-x86_64" | sha256sum -c -

      # `appimage` is opt-in through `--target` (ADR 0024): the default set stays deb + rpm,
      # naming it explicitly means a missing `appimagetool` fails loudly instead of quietly
      # shipping one format fewer. The Flatpak is the separate job below — it needs
      # flatpak-builder and a privileged container, and it builds from the hand-maintained
      # `eu.jumplink.Kurier.json` (both `kurier` and `kurier-app`), not from this `ship` call.
      - name: Package for Linux (deb, rpm, AppImage)
        working-directory: app
        run: gjsify ship linux --skip-build --target deb,rpm,appimage

      # Names are the ones `utils/ship/formats.ts` in gjsify actually renders, not guesses —
      # `ship` exits 0 after writing nothing when every target is filtered away, so each
      # artifact is asserted by name.
      - name: Assert the Linux packages arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          binary=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').gjsify.ship.binaryName")
          missing=0
          for f in \
            "${binary}_${version}-1_all.deb" \
            "${binary}-${version}-1.noarch.rpm" \
            "${binary}-${version}-1.x86_64.AppImage"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # macOS and Windows runtimes are `optionalDependencies` gated by os/cpu
      # (`@gjsify/node-runtime-{darwin-arm64,darwin-x64,win32-x64}`), which a plain install on
      # this Linux host SKIPS — naming the target installs it instead, and `ship` picks up both
      # that runtime and the matching `@gjsify/node-gi` native addon from node_modules at pack
      # time. Assembly is not host-bound (ADR 0024 § A1): the Mach-O and PE payloads are only
      # VERIFIED on their own OS — a Mac or a Windows runner would be for that, not assembled
      # on one.
      - name: Package macOS (arm64)
        run: gjsify install --os darwin --cpu arm64 --immutable

      - name: Ship macOS (arm64)
        working-directory: app
        run: gjsify ship darwin --arch arm64 --skip-build --target macos-app-zip

      - name: Package macOS (x64)
        run: gjsify install --os darwin --cpu x64 --immutable

      - name: Ship macOS (x64)
        working-directory: app
        run: gjsify ship darwin --arch x64 --skip-build --target macos-app-zip

      # `msi` needs `wixl` (msitools, installed above); `windows-dir-zip` needs nothing `ship`
      # does not write itself.
      - name: Package Windows (x64)
        run: gjsify install --os win32 --cpu x64 --immutable

      - name: Ship Windows (x64)
        working-directory: app
        run: gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      # UNSIGNED on all three, by design (ADR 0024 § A13) — a legitimate deliverable, not a
      # placeholder. Where signing would attach, on a runner that actually holds the identity:
      #   macOS   — `gjsify ship darwin --arch <arch> --skip-build --target macos-app-zip
      #             --sign <identity>` (Developer ID; `--notarize <keychain-profile>` on top)
      #   Windows — same shape, `--sign <certificate thumbprint or PFX path>` reaching
      #             `signtool` (UNVERIFIED upstream: no run in gjsify has ever invoked it)
      - name: Assert the macOS and Windows artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          binary=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').gjsify.ship.binaryName")
          missing=0
          for f in \
            "${binary}-${version}-1.macos.arm64.zip" \
            "${binary}-${version}-1.macos.x86_64.zip" \
            "${binary}-${version}-1.windows.x64.zip" \
            "${binary}-${version}-1.x64.msi"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # Both package formats in ONE upload under one name: `release.yml` downloads artifacts by
      # name, and two uploads of the same artifact name is an error, not a merge.
      - uses: actions/upload-artifact@v4
        with:
          name: ship-deb-rpm-appimage
          path: |
            app/ship/out/*.deb
            app/ship/out/*.rpm
            app/ship/out/*.AppImage
          # Already-compressed packages; the default level 6 would spend minutes
          # re-compressing them on the way up and again on the way down for no gain.
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: ship-macos-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
          compression-level: 0

  # The Flatpak half, split out for the two reasons beifahrer's and troedler's ci.yml name.
  #
  # flatpak-builder is one: a Flatpak is an OSTree static delta and `flatpak build-bundle` is
  # the only thing that writes one. PRIVILEGE is the other: flatpak-builder runs every module's
  # `build-commands` under `bwrap`, which a `fedora:44` container without `options: --privileged`
  # refuses ("Can't mount proc on /proc: Permission denied").
  #
  # Builds from the hand-maintained `eu.jumplink.Kurier.json` — kurier's manifest stages BOTH
  # `kurier` and `kurier-app` (data/README.md), which is not what `gjsify ship --target flatpak`
  # would produce (it assembles its own manifest from `gjsify.ship`, one binary only) — so this
  # job calls `gjsify flatpak build`, not `gjsify ship`, to package the artifact Flathub actually
  # reviews.
  ship-flatpak:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs flatpak flatpak-builder

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      - name: Cache the flatpak runtimes
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-gnome-50-f44

      # `--system`, because that is the installation `flatpak-builder` reads when gjsify's
      # `flatpak build` wrapper invokes it (no `--user`). The two SDK extensions are the
      # manifest's own `sdk-extensions`: node24 and typescript, read by `build-options.append-path`.
      - name: Install the GNOME runtime, SDK and its extensions
        run: |
          set -eu
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-modify --enable flathub
          flatpak install --system --noninteractive \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.node24//50 \
            org.freedesktop.Sdk.Extension.typescript//50
          flatpak list --runtime --columns=ref

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      # Builds the Flatpak straight from the checkout's manifest and build-commands (which run
      # `gjsify install`/`build`/`build:app` INSIDE the sandbox) — no host-side install or build
      # step belongs here, unlike the job above.
      - name: Build the Flatpak
        run: |
          set -eu
          gjsify flatpak build eu.jumplink.Kurier.json \
            --repo repo --bundle eu.jumplink.Kurier.flatpak

      - name: Assert the bundle arrived
        run: |
          set -eu
          ls -la eu.jumplink.Kurier.flatpak
          [ -s eu.jumplink.Kurier.flatpak ] || { echo "::error::missing or empty eu.jumplink.Kurier.flatpak"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ship-flatpak
          path: eu.jumplink.Kurier.flatpak
          compression-level: 0
